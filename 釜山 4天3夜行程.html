<html lang="zh-Hant" data-theme="light" style="color-scheme: light;"><head>

<title>釜山 4天3夜行程</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fdf1dc;--card:#fffaf0;--tx:#3a2a1f;--sub:#8a6a50;--ac:#c8431f;--ac2:#fde0c8;--bd:#6b4a33;--dg:#c0392b;--gr:#03c75a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1812;--card:#2b2119;--tx:#f7e9d6;--sub:#c9ac8e;--ac:#e0572c;--ac2:#4a2e20;--bd:#8a6a50;--dg:#ff7b6b}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(to bottom,#ffcf8f 0,#ffe7b0 240px,rgba(255,231,176,0) 430px);background-repeat:no-repeat;color:var(--tx);font:16px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 100px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:5}
#bar:empty{display:none}
.dbar{margin-bottom:12px}
.drange{font-weight:700;text-align:center;margin-bottom:2px;color:var(--ac)}
.dtrack{position:relative;padding-top:58px}
.dwho{position:absolute;top:0;transform:translateX(-50%);transition:left .5s cubic-bezier(.3,1.4,.5,1);pointer-events:none;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-4px}}
.dline{position:absolute;top:67px;height:3px;background:var(--bd);border-radius:2px}
.dcols{display:flex;position:relative}
.dcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--tx);font:inherit;padding:0}
.ddot{width:18px;height:18px;border-radius:50%;background:var(--card);border:3px solid var(--bd)}
.dcol.on .ddot{background:var(--ac)}
.dnum{font-size:1.35em;font-weight:700;width:38px;height:38px;line-height:34px;border-radius:50%;text-align:center}
.dcol.on .dnum{background:var(--ac);color:#fff}
.ddate{font-size:.8em;color:var(--sub)}
#bar button{pointer-events:auto;display:block;width:100%;max-width:640px;margin:0 auto;padding:14px;border-radius:16px;border:2px solid var(--bd);background:var(--card);color:var(--sub);font:inherit;font-weight:700;box-shadow:3px 3px 0 var(--bd)}
#bar button.dirty{background:var(--ac);color:#fff}
#fall{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);width:min(calc(100% - 28px),612px);aspect-ratio:640/290;border-radius:22px;pointer-events:none;overflow:hidden;z-index:4}
.lf{position:absolute;top:-12%;opacity:0;animation:fall linear infinite}
@keyframes fall{0%{top:-12%;opacity:0;transform:translateX(0) rotate(0)}12%{opacity:.9}30%{transform:translateX(22px) rotate(100deg)}55%{transform:translateX(-18px) rotate(220deg)}75%{opacity:.6}100%{top:98%;opacity:0;transform:translateX(14px) rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.st{transform-box:fill-box;animation:steam 3s ease-in infinite}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.9}100%{transform:translateY(-18px);opacity:0}}
.tw{animation:tw 1.8s ease-in-out infinite}
.hang{transform-box:fill-box;transform-origin:50% 0;animation:hang 3.4s ease-in-out infinite}
@keyframes hang{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.fl{animation:flt 3.2s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.st,.tw{animation:none}}
body.mom #fall{opacity:.55}
@media (prefers-reduced-motion:reduce){.lf,.sway,.spin{animation:none}.lf{display:none}}
h1{font-size:26px;margin:4px 0;font-family:"Kaiti TC","BiauKai","DFKai-SB",serif}
.hero{width:100%;height:auto;display:block;margin-bottom:12px;-webkit-mask-image:linear-gradient(to bottom,#000 86%,transparent);mask-image:linear-gradient(to bottom,#000 86%,transparent)}
.sub{color:var(--sub);margin:0 0 12px}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button,.tabs button{flex:1;padding:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px 18px 14px 18px;font:inherit;font-weight:600}
.seg button.on,.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:none;min-width:72px}
.dt{font-size:20px;font-weight:700;margin:6px 0 10px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px 24px 16px 22px;margin-bottom:12px;overflow:hidden;box-shadow:3px 3px 0 var(--bd)}
.sum{width:100%;display:flex;align-items:center;gap:10px;padding:14px;background:none;border:0;color:var(--tx);font:inherit;text-align:left}
.tm{background:var(--ac2);color:var(--ac);border-radius:8px;padding:2px 8px;font-size:14px;font-weight:600;white-space:nowrap}
.nm{flex:1;font-weight:700;font-size:18px}
.bd{padding:0 14px 14px}
.tips{white-space:pre-wrap;margin:0 0 10px}
.ph{display:flex;gap:8px;margin-bottom:10px}
.ph div{flex:1;position:relative}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}
.ph .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:28px;height:28px}
.maps{display:flex;gap:8px;margin-bottom:8px}
.maps a{flex:1;text-align:center;padding:12px;border-radius:12px;color:#fff;text-decoration:none;font-weight:700}
.g{background:#4285f4}.n{background:var(--gr)}
label{display:block;font-size:13px;color:var(--sub);margin:8px 0 2px}
input,textarea,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:110px}
.row{display:flex;gap:8px;margin-top:10px}
.row button,.add,.up{padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.row .del{color:var(--dg);margin-left:auto}
.add{width:100%;border-style:dashed;color:var(--ac);font-weight:700;padding:14px}
.reset{background:none;border:0;color:var(--sub);text-decoration:underline;margin-top:18px;font:inherit;font-size:13px}
.up{display:inline-block}
body.mom{font-size:22px;font-weight:700}
body.mom .nm{font-size:28px}
body.mom .tm{font-size:20px}
body.mom .dt{font-size:30px}
body.mom h1{font-size:32px}
body.mom .maps a{padding:18px;font-size:24px}
body.mom .tabs button,body.mom .seg button{font-size:22px;padding:14px}
